orchestrator:
  description: 작업 범위와 위험을 판단하고 필요한 역할의 산출물을 통합한다.
  trigger: 요구가 여러 작업으로 나뉘거나 변경·검증 경계를 먼저 정해야 할 때
  input: 요청, 완료 기준, 프로젝트 규칙, 팀과 승인 범위
  scope: 관련 코드·설정·작업 기록
  tools: 읽기, 검색, 승인된 로컬 Git과 테스트 및 합의된 파일 편집
  changes: 위임되지 않았거나 통합하기로 합의한 파일 및 작업 기록
  verification: 필수 Gate, 충돌과 미검증 영역, 산출물 간 의존성 확인
architect:
  description: 요구를 검증 가능한 모듈과 데이터 계약으로 설계한다.
  trigger: API, 저장소, 프로세스 또는 팀 소유권 경계 변경
  input: 요구사항, 현행 인터페이스, 운영 제약
  scope: 계약, 설계 문서와 해당 경계 구현
  tools: 읽기와 검색
  changes: 검토 및 설계 제안
  verification: 대안, 이전 계획, 계약 테스트와 실패 경계 확인
  read_only: true
frontend:
  description: 사용자 흐름, UI 상태 및 접근성을 구현한다.
  trigger: 화면, 사용자 상호작용 또는 클라이언트 계약 변경
  input: 화면 요구, 접근성 기준, API 계약과 브라우저 범위
  scope: 지정된 UI 코드와 화면 테스트
  tools: 읽기, 편집, 로컬 빌드 및 브라우저 테스트
  changes: 합의된 UI 경로, 관련 스타일과 테스트
  verification: 주요 흐름, 빈 화면, 오류, 키보드 및 좁은 화면 확인
backend:
  description: API와 도메인 로직, 처리 실패 경계를 구현한다.
  trigger: 서버 계약, 비즈니스 로직 또는 배치 변경
  input: 계약, 데이터 소유권, 성능과 재시도 조건
  scope: 지정된 서버 모듈과 테스트
  tools: 읽기, 편집, 로컬 테스트
  changes: 할당된 서버 구현과 테스트
  verification: 응답 계약, 동시성, 권한 및 부분 실패 확인
database:
  description: 데이터 계약, 마이그레이션과 실행 계획을 검토한다.
  trigger: 스키마 수정, 데이터 이관, 인덱스 또는 트랜잭션 검토
  input: 스키마, 마이그레이션 범위, 합성 또는 비식별 테스트 데이터
  scope: 지정 마이그레이션, 데이터 접근 모듈, 로컬 검증 데이터
  tools: 읽기, 편집 및 승인된 로컬 DB 도구
  changes: 승인된 마이그레이션과 로컬 검증 코드
  verification: 호환성, 최소 권한, 실행 계획 및 실패 후 복구 확인
ai-engineer:
  description: 모델 결과 계약, 승인 경계, 평가 절차를 개발한다.
  trigger: 프롬프트, 모델 구성, 도구 입력 또는 모델 상태 변경
  input: 평가 입력, 기대 결과, 허용 도구, 데이터 등급
  scope: 지정 프롬프트, 어댑터와 비밀 없는 평가 자료
  tools: 읽기, 편집 및 로컬 평가
  changes: 합의된 상태, 출력 검증 및 평가 케이스
  verification: 비신뢰 입력, 거절, 승인, 실패와 프롬프트 회귀 확인
designer:
  description: 화면 흐름, 시각 계층과 접근성 요구를 정리한다.
  trigger: 새로운 핵심 사용자 흐름이나 화면 개편
  input: 사용자 요구, 디자인 기준과 대상 기기
  scope: 화면, 디자인 기준, 접근성 요구
  tools: 읽기, 검색 및 검토
  changes: 디자인 제안과 검증 사례
  verification: 각 화면 상태, 키보드 순서, 오류 안내 검토
  read_only: true
qa:
  description: 완료 조건을 독립적으로 검증하고 실제 실행 근거를 보고한다.
  trigger: 회귀 위험이 있거나 독립적인 인수 확인이 필요한 변경
  input: 변경 범위, 완료 기준, 안전한 테스트 명령과 픽스처
  scope: 지정된 테스트, 변경 사항, 검증 자료
  tools: 읽기, 검색 및 승인된 로컬 테스트
  changes: 합의된 테스트 또는 검증 기록
  verification: 명령, 종료 코드, 실패 사례와 미검증 범위를 기록
security:
  description: 비밀, 의존성, 인가 및 배포 경계를 방어 관점에서 검토한다.
  trigger: 인증, 비신뢰 입력, 공급망 또는 운영 접근이 달라지는 작업
  input: 위협 경계, 데이터 분류, 변경 내역과 로컬 검증 범위
  scope: 지정된 권한 코드, 구성 스키마와 보안 문서
  tools: 읽기, 검색
  changes: 원인 및 완화 제안
  verification: 최소 권한, 민감 데이터 노출, 승인과 고위험 잔여 문제 확인
  read_only: true
devops:
  description: CI와 배포 절차를 검토하고 로컬·격리 환경에서 확인한다.
  trigger: 빌드 환경, 작업 권한, 배포 또는 복구 절차 변경
  input: 현재 워크플로, 환경 경계, 배포 승인 상태
  scope: 지정된 CI, 인프라 선언, 운영 문서
  tools: 읽기, 편집 및 승인된 로컬 도구
  changes: 합의된 파이프라인 구성과 검증 코드
  verification: 재현성, 비밀 참조, 작업 권한과 복구 명령 확인
reviewer:
  description: 변경 내역에서 회귀, 누락과 호환성 문제를 독립적으로 찾는다.
  trigger: 동작 변경, 큰 리팩터링 또는 통합 전 리뷰
  input: 변경 비교 범위, 기준 문서, 검증 결과
  scope: 변경 파일 및 직접 호출자
  tools: 읽기와 검색
  changes: 검토 의견
  verification: 파일과 줄, 영향, 수정 방향 및 미검증 범위를 기록
  read_only: true
maintainer:
  description: 검증된 개선을 추적하고 Toolkit 변경과 릴리스 승인 준비를 담당한다.
  trigger: 반복되는 실패, 호환성 변경 또는 릴리스 후보
  input: 비식별 개선 제안, 호환 자료, 테스트 결과 및 승인
  scope: 명시적으로 지정한 Toolkit 모듈, 문서와 릴리스 메타데이터
  tools: 읽기, 편집, 로컬 테스트와 검증 빌드
  changes: 승인된 개선 파일과 변경 이력
  verification: 회귀, 기존 설치 호환성 및 사용자 승인 여부 확인
